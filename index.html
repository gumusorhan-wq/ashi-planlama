<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUSER ASHİ PLANLAMA v01.00</title>
<style>html,body{margin:0;background:#f4f6f9}
.ap-root{--ap-bg:#f4f6f9;--ap-card:#fff;--ap-ink:#1b2733;--ap-mut:#64748b;--ap-line:#dbe2ea;--ap-pri:#0f5b7a;--ap-pri2:#e6f2f7;--ap-bad:#b42318;--ap-badbg:#fdecea;--ap-ok:#16794a;--ap-okbg:#e5f6ee;--ap-warn:#9a5b00;--ap-warnbg:#fff4de;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ap-ink);background:var(--ap-bg);min-height:100%;box-sizing:border-box}
.ap-root.ap-dark{--ap-bg:#0f1720;--ap-card:#17212c;--ap-ink:#e6edf3;--ap-mut:#93a4b5;--ap-line:#2a3846;--ap-pri:#5fb4d6;--ap-pri2:#14303d;--ap-bad:#ff8a80;--ap-badbg:#3a1d1b;--ap-ok:#5fd39b;--ap-okbg:#12301f;--ap-warn:#f5c26b;--ap-warnbg:#3a2c10}
.ap-root *{box-sizing:border-box}
.ap-top{background:var(--ap-card);border-bottom:1px solid var(--ap-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
.ap-top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.ap-top .ap-sp{flex:1}
.ap-ay{display:flex;align-items:center;gap:6px}
.ap-ay b{min-width:120px;text-align:center;font-size:15px}
.ap-badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ap-line);background:var(--ap-bg)}
.ap-b-taslak{background:var(--ap-warnbg);color:var(--ap-warn);border-color:transparent}.ap-b-kesin{background:var(--ap-okbg);color:var(--ap-ok);border-color:transparent}.ap-b-kilitli{background:var(--ap-badbg);color:var(--ap-bad);border-color:transparent}
.ap-nav{display:flex;gap:2px;flex-wrap:wrap;padding:6px 16px 0;background:var(--ap-card);border-bottom:1px solid var(--ap-line)}
.ap-nav button{border:0;background:none;padding:9px 13px;font:inherit;color:var(--ap-mut);cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.ap-nav button.on{color:var(--ap-pri);border-color:var(--ap-pri)}
.ap-main{padding:16px;max-width:1500px;margin:0 auto}
.ap-card{background:var(--ap-card);border:1px solid var(--ap-line);border-radius:10px;padding:14px;margin-bottom:14px}
.ap-card h2{font-size:15px;margin:0 0 10px}
.ap-btn{font:inherit;font-weight:600;border:1px solid var(--ap-line);background:var(--ap-card);color:var(--ap-ink);padding:6px 12px;border-radius:7px;cursor:pointer}
.ap-btn:hover{background:var(--ap-pri2)}.ap-btn.pri{background:var(--ap-pri);color:#fff;border-color:var(--ap-pri)}.ap-btn.pri:hover{filter:brightness(1.1)}
.ap-btn[disabled]{opacity:.45;cursor:not-allowed}.ap-btn.sm{padding:3px 8px;font-size:12px}.ap-btn.dng{color:var(--ap-bad)}
.ap-in,.ap-sel{font:inherit;padding:5px 8px;border:1px solid var(--ap-line);border-radius:6px;background:var(--ap-card);color:var(--ap-ink);max-width:100%}
.ap-in.n{width:70px;text-align:right}.ap-in.w{width:100%}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ap-st{border:1px solid var(--ap-line);border-radius:10px;padding:11px;background:var(--ap-card);cursor:pointer}
.ap-st:hover{border-color:var(--ap-pri)}
.ap-st h3{margin:0 0 6px;font-size:13.5px}
.ap-st .r{display:flex;justify-content:space-between;color:var(--ap-mut);font-size:12.5px}.ap-st .r b{color:var(--ap-ink)}
.ap-bar{height:7px;border-radius:5px;background:var(--ap-line);margin:7px 0;overflow:hidden}.ap-bar i{display:block;height:100%;background:var(--ap-pri)}
.ap-bar.bad i{background:#d9534f}.ap-bar.ok i{background:#2e9e6a}.ap-bar.fz i{background:#e0a21a}
.ap-tag{font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:700}
.ap-t-ih{background:var(--ap-badbg);color:var(--ap-bad)}.ap-t-fz{background:var(--ap-warnbg);color:var(--ap-warn)}.ap-t-ok{background:var(--ap-okbg);color:var(--ap-ok)}
.ap-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ap-sum div{background:var(--ap-card);border:1px solid var(--ap-line);border-radius:10px;padding:10px 12px}
.ap-sum b{display:block;font-size:22px}.ap-sum span{color:var(--ap-mut);font-size:12.5px}
.ap-tw{overflow:auto;border:1px solid var(--ap-line);border-radius:8px}
table.ap-t{border-collapse:collapse;width:100%;font-size:13px;background:var(--ap-card)}
.ap-t th{background:var(--ap-pri2);text-align:left;padding:7px 8px;font-size:12px;white-space:nowrap;position:sticky;top:0}
.ap-t td{border-top:1px solid var(--ap-line);padding:4px 6px;vertical-align:middle}
.ap-t tr.sep td{background:#0b2a5b;height:6px;padding:0}
.ap-t tr.c td{color:#111}
.ap-t td.num{text-align:right;font-variant-numeric:tabular-nums}
.ap-pos{color:var(--ap-ok);font-weight:700}.ap-neg{color:var(--ap-bad);font-weight:700}
.ap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ap-note{color:var(--ap-mut);font-size:12.5px}
.ap-modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.ap-modal>div{background:var(--ap-card);color:var(--ap-ink);border-radius:12px;max-width:900px;width:100%;padding:18px}
.ap-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.ap-two{grid-template-columns:1fr}.ap-main{padding:10px}}
.ap-empty{text-align:center;padding:40px 10px;color:var(--ap-mut)}
.ap-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:6px 0}.ap-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid #0002}
.ap-toast{position:fixed;right:14px;bottom:14px;background:#17212c;color:#fff;padding:9px 14px;border-radius:8px;z-index:90;font-size:13px;max-width:360px}
.ap-err{background:var(--ap-badbg);color:var(--ap-bad);padding:8px 10px;border-radius:7px;margin:8px 0}
.ap-ok{background:var(--ap-okbg);color:var(--ap-ok);padding:8px 10px;border-radius:7px;margin:8px 0}
@media print{.ap-top,.ap-nav,.ap-noprint{display:none!important}}

.ap-sum .ap-click{cursor:pointer;transition:border-color .12s,box-shadow .12s}.ap-sum .ap-click:hover{border-color:var(--ap-pri)}.ap-sum .ap-click.on{border-color:var(--ap-pri);box-shadow:0 0 0 2px var(--ap-pri2) inset;background:var(--ap-pri2)}

.ap-sum.ap-sum1{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;grid-template-columns:none}
.ap-sum1>div{flex:1 1 0;min-width:104px;padding:8px 10px}.ap-sum1 b{font-size:19px}.ap-sum1 span{font-size:11.5px;line-height:1.25;display:block}
.ap-subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ap-subnav button{font:inherit;font-weight:600;border:1px solid var(--ap-line);background:var(--ap-card);color:var(--ap-mut);padding:7px 14px;border-radius:99px;cursor:pointer}
.ap-subnav button:hover{border-color:var(--ap-pri)}.ap-subnav button.on{background:var(--ap-pri);border-color:var(--ap-pri);color:#fff}
.ap-pager{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:8px 0}.ap-pager .ap-btn.on{background:var(--ap-pri);color:#fff;border-color:var(--ap-pri)}

/* İstasyon tablosu: sabit sütun genişlikleri, yana taşma yok */
.ap-tw-ist{overflow-x:auto}
table.ap-ist{table-layout:fixed;width:100%;min-width:1040px;font-size:12.5px}
.ap-ist th{padding:6px 4px;font-size:11px;white-space:normal;line-height:1.2}
.ap-ist td{padding:3px 4px;overflow-wrap:anywhere;vertical-align:middle}
.ap-ist .ap-in,.ap-ist .ap-sel{width:100%;min-width:0;max-width:100%;font-size:12.5px;padding:4px 5px;text-overflow:ellipsis}
.ap-ist .ap-in.n{width:100%;text-align:right;padding-right:3px}
.ap-ist input[type=number]::-webkit-inner-spin-button,.ap-ist input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ap-ist input[type=number]{-moz-appearance:textfield;appearance:textfield}
.ap-ist .ap-note{font-size:11px;line-height:1.2}
.ap-ist td:last-child{white-space:normal}.ap-ist td:last-child .ap-btn{padding:2px 6px;font-size:11.5px;margin:1px 0}
.ap-ist .ap-tag{font-size:10.5px;padding:0 5px}
.ap-root{overflow-x:hidden}
.ap-mod{display:flex;gap:4px}.ap-mod button{font:inherit;font-weight:700;border:1px solid var(--ap-line);background:var(--ap-card);color:var(--ap-mut);padding:5px 12px;border-radius:7px;cursor:pointer}.ap-mod button.on{background:var(--ap-pri);color:#fff;border-color:var(--ap-pri)}
table.n2{border-collapse:collapse;font-size:12px}table.n2 th.n2d{min-width:26px;padding:2px;text-align:center;font-size:11px}table.n2 th.hs,table.n2l tr.hs td{background:rgba(120,120,120,.12)}
td.n2c{min-width:26px;height:26px;text-align:center;border:1px solid var(--ap-line);cursor:pointer;user-select:none}td.n2c.iz{background:#fde68a;cursor:default}td.n2c.is{background:#fecaca;color:var(--ap-bad);font-weight:700}td.n2c.on{background:rgba(250,204,21,.18);cursor:default}td.n2c.nb{background:var(--ap-pri2);color:var(--ap-pri);font-weight:700;cursor:default}
td.n2n{white-space:nowrap;padding-right:10px}.n2e{background:var(--ap-badbg)!important;color:var(--ap-bad)}select.n2s{width:100%;min-width:130px;padding:2px 4px;font-size:12.5px}table.n2l td{padding:2px 4px}
.ap-yh{margin-top:8px;font-size:11.5px;color:var(--ap-mut);font-weight:600}
.ap-yuva{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:1px 0}.ap-yuva>span:first-child{flex:1;color:var(--ap-mut)}.ap-yuva .v{font-weight:700}
.ap-ek{margin-top:8px;padding:6px 8px;border-radius:7px;background:var(--ap-badbg);font-size:12.5px;line-height:1.35}.ap-ek b{color:var(--ap-bad)}.ap-ek.ap-ek-c{background:var(--ap-warnbg)}.ap-ek.ap-ek-c b{color:var(--ap-warn)}.ap-ek.ap-ek-e{background:#ffedd5}.ap-ek.ap-ek-e b{color:#9a3412}
.ap-drop{border:2px dashed var(--ap-line);border-radius:10px;padding:14px;margin:8px 0 12px}.ap-drop:hover{border-color:var(--ap-pri);background:var(--ap-pri2)}
.ap-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin:8px 0 12px;padding-bottom:2px}.ap-toolbar>*{flex:none;white-space:nowrap}
.ap-seg{display:inline-flex;border:1px solid var(--ap-line);border-radius:8px;overflow:hidden}.ap-seg button{font:inherit;font-weight:600;border:0;background:var(--ap-card);color:var(--ap-mut);padding:6px 12px;cursor:pointer}.ap-seg button.on{background:var(--ap-pri);color:#fff}
.ap-azami.off{opacity:.5}.ap-azami .ap-in{width:56px;padding:3px 6px}
.ap-top{flex-wrap:nowrap;gap:8px;overflow-x:auto}.ap-top>*{flex:none}.ap-top .ap-sel{max-width:170px}.ap-top .ap-ay b{min-width:96px}.ap-mod button{padding:5px 10px}
.n2art{color:var(--ap-ok);font-weight:700}.n2eks{color:var(--ap-bad);font-weight:700}b.n2d{color:var(--ap-pri)}
.ap-t th.num{text-align:right}.ap-t td.num,.ap-t th.num{padding-left:18px;white-space:nowrap}
</style>

<script>
/* HUSER ASHİ PLANLAMA — hesap çekirdeği (DOM'dan bağımsız; modül olarak da kullanılabilir) */
const APCore = (() => {
  const TR = s => String(s ?? '').toLocaleUpperCase('tr-TR').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const gunSayisi = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const MESAI = {memur: 8, isci: 7.5};
  const ARIFE_SAAT = 5;
  const YUVA_VARSAYILAN = 3;
  const ISCI_NOBET_DUSULEN = 11;      // 12 saat yazılır, sistemden 11 saat düşülür
  const NOBET_SAAT = 24;
  const ADIM = 0.5;

  // Resmî tatil çarpanı: 0 = tam tatil, 'A' = arife (yarım). Nöbet Sayım uygulamasındaki tabloyla aynıdır.
  const RESMI = (() => {
    const t = {}, add = (l, w) => l.forEach(d => { t[d] = w; });
    for (let y = 2024; y <= 2032; y++) {
      add([`${y}-01-01`, `${y}-04-23`, `${y}-05-01`, `${y}-05-19`, `${y}-07-15`, `${y}-08-30`, `${y}-10-29`], 0);
      add([`${y}-10-28`], 'A');
    }
    const dini = {
      2024: [['2024-04-10','2024-04-12','2024-04-09'], ['2024-06-16','2024-06-19','2024-06-15']],
      2025: [['2025-03-30','2025-04-01','2025-03-29'], ['2025-06-06','2025-06-09','2025-06-05']],
      2026: [['2026-03-20','2026-03-22','2026-03-19'], ['2026-05-27','2026-05-30','2026-05-26']],
      2027: [['2027-03-09','2027-03-11','2027-03-08'], ['2027-05-16','2027-05-19','2027-05-15']],
      2028: [['2028-02-26','2028-02-28','2028-02-25'], ['2028-05-05','2028-05-08','2028-05-04']],
      2029: [['2029-02-14','2029-02-16','2029-02-13'], ['2029-04-24','2029-04-27','2029-04-23']],
      2030: [['2030-02-04','2030-02-06','2030-02-03'], ['2030-04-13','2030-04-16','2030-04-12']]
    };
    Object.values(dini).forEach(p => p.forEach(([a, b, ar]) => {
      for (let ms = Date.parse(a + 'T00:00:00Z'); ms <= Date.parse(b + 'T00:00:00Z'); ms += 864e5) t[new Date(ms).toISOString().slice(0, 10)] = 0;
      t[ar] = 'A';
    }));
    return t;
  })();
  const OZEL_TUR = {bayram: 'Bayram günü', resmi: 'Resmî tatil', idari: 'İdari izin günü', yarim: 'Yarım gün (5 saat)'};

  // Bir günün kadro saati. ozel = { 'YYYY-AA-GG': {tur} }
  function gunSaat(dateIso, isci, ozel) {
    const normal = isci ? MESAI.isci : MESAI.memur;
    const dow = new Date(dateIso + 'T00:00:00Z').getUTCDay();   // 0 pazar … 6 cumartesi
    if (dow === 0) return 0;
    if (dow === 6 && !isci) return 0;
    const og = ozel && ozel[dateIso];
    if (og) return og.tur === 'yarim' ? Math.min(normal, ARIFE_SAAT) : 0;
    const w = RESMI[dateIso];
    if (w === 'A') return Math.min(normal, ARIFE_SAAT);
    return w === undefined ? normal : normal * w;
  }
  function ayMesai(y, m, isci, ozel) {
    let t = 0; for (let d = 1; d <= gunSayisi(y, m); d++) t += gunSaat(iso(y, m, d), isci, ozel);
    return Math.round(t * 100) / 100;
  }

  // Durum tablosu (Ayarlar'dan değiştirilebilir). nobetYok: nöbet tutmaz, mesaiYok: o ay mesai yükümlülüğü yok (izinli), disarida: başka birimde görevli.
  const DURUM_VARSAYILAN = {
    'GEÇİCİ GÖREVDE':      {renk: '#C0504D', nobetYok: true,  mesaiYok: true,  disarida: true},
    'GEÇİCİ GÖREVLİ':      {renk: '#9BBB59', nobetYok: false, mesaiYok: false, gelen: true},
    'DOĞUM ÖNCESİ':        {renk: '#B1A0C7', nobetYok: true,  mesaiYok: true},
    'DOĞUM SONRASI':       {renk: '#B1A0C7', nobetYok: true,  mesaiYok: true},
    'ANALIK HAKKI':        {renk: '#B1A0C7', nobetYok: true,  mesaiYok: false},
    'ANALIK MESAİ':        {renk: '#B1A0C7', nobetYok: true,  mesaiYok: false},
    'GEBE MESAİ':          {renk: '#B1A0C7', nobetYok: true,  mesaiYok: false},
    'RİSKLİ GEBELİK':      {renk: '#B1A0C7', nobetYok: true,  mesaiYok: true},
    'RAPORLU':             {renk: '#A6A6A6', nobetYok: true,  mesaiYok: true},
    'HEYET RAPORLU':       {renk: '#A6A6A6', nobetYok: true,  mesaiYok: true},
    'ÜCRETSİZ İZİN':       {renk: '#D9D9D9', nobetYok: true,  mesaiYok: true},
    'ASKERLİK İZNİ':       {renk: '#D9D9D9', nobetYok: true,  mesaiYok: true},
    'YARI ZAMANLI':        {renk: '#FCD5B4', nobetYok: true,  mesaiYok: false},
    'SAĞLIK MAZERETİ MESAİ': {renk: '#FCD5B4', nobetYok: true, mesaiYok: false},
    'MESAİ USULÜ':         {renk: '#FCD5B4', nobetYok: true,  mesaiYok: false},
    'NÖBET USULÜ':         {renk: null,      nobetYok: false, mesaiYok: false},
    'AİLE HEKİMLİĞİNDE':   {renk: '#D9D9D9', nobetYok: true,  mesaiYok: true,  disarida: true, disKurum: true},
    'NÖBET MUAFİYETİ':     {renk: '#FCD5B4', nobetYok: true,  mesaiYok: false},
    'UZMANLIK EĞİTİMİ':    {renk: '#D9D9D9', nobetYok: true,  mesaiYok: true},
    'PASİF':               {renk: '#EEEEEE', nobetYok: true,  mesaiYok: true,  pasif: true}
  };
  // Excel'deki serbest yazılmış durum metnini listedeki anahtara çevirir
  function durumAnahtar(txt) {
    const t = TR(txt); if (!t) return '';
    const kural = [
      [/GECICI GOREVDE|G\.?GOREVDE/, 'GEÇİCİ GÖREVDE'], [/GECICI GOREVLI/, 'GEÇİCİ GÖREVLİ'],
      [/DOGUM ONCESI/, 'DOĞUM ÖNCESİ'], [/DOGUM SONRASI|DOGUM/, 'DOĞUM SONRASI'],
      [/ANALIK.*MESAI|ANALIK MESAI/, 'ANALIK MESAİ'], [/ANALIK/, 'ANALIK HAKKI'],
      [/RISKLI GEBE/, 'RİSKLİ GEBELİK'], [/GEBE/, 'GEBE MESAİ'],
      [/HEYET/, 'HEYET RAPORLU'], [/RAPOR/, 'RAPORLU'],
      [/AILE HEK/, 'AİLE HEKİMLİĞİNDE'], [/UZMANLIK/, 'UZMANLIK EĞİTİMİ'],
      [/UCRETSIZ/, 'ÜCRETSİZ İZİN'], [/ASKER/, 'ASKERLİK İZNİ'], [/YARI|YART/, 'YARI ZAMANLI'],
      [/SAGLIK MAZ.*MESAI|MAZERET.*MESAI|SAGLIK MAZ/, 'SAĞLIK MAZERETİ MESAİ'],
      [/NOBET MUAF/, 'NÖBET MUAFİYETİ'], [/MESAI USULU/, 'MESAİ USULÜ'], [/NOBET USULU/, 'NÖBET USULÜ']
    ];
    for (const [re, k] of kural) if (re.test(t)) return k;
    return '';
  }
  function sinifTespit(unvan) {
    const t = TR(unvan);
    if (!t) return '';
    if (/DOKTOR|TABIP|HEKIM/.test(t)) return 'doktor';
    if (/ISCI|4\/D|SOFOR|SURUCU/.test(t)) return 'isci';
    if (/^[\d.,\s]+$/.test(t) || t.startsWith('=')) return '';
    return 'memur';
  }

  // Kişinin ay mesaisi (saat). k: {sinif, durum, izin:[{gun, bas?, bit?}], sut}
  // ASOS'taki izin/görev bitiş tarihi dönüş gününü gösterir (nöbet 09:00'da biter): son izinli gün bir önceki gündür. Elle girilen tarihli izinlerde bitiş dahildir.
  function izinSon(iz) { if (!iz.asos || !iz.bit) return iz.bit; return new Date(Date.parse(iz.bit + 'T00:00:00Z') - 864e5).toISOString().slice(0, 10); }
  function kisiMesai(k, y, m, ozel, durumlar) {
    const isci = k.sinif === 'isci', dt = durumlar[k.durum] || {};
    if (dt.mesaiYok) return 0;
    const tum = ayMesai(y, m, isci, ozel);
    let izinSaat = 0;
    const gunler = {};
    (k.izin || []).forEach(iz => {
      if (iz.bas && iz.bit) {
        for (let ms = Date.parse(iz.bas + 'T00:00:00Z'); ms <= Date.parse(izinSon(iz) + 'T00:00:00Z'); ms += 864e5) {
          const d = new Date(ms).toISOString().slice(0, 10);

  // yuva yetenekleri (Modül 1 ile aynı): dok → ekip şefi; işçi → sürücü (12 saat); AABT → her yuva; ATT yalnız YSP / sürücü + YSP
  const YETENEK = {dok: ['es'], isci: ['sur'], ke: ['es', 'ysp'], ka: ['es', 'ysp', 'sur'], ysp: ['ysp'], sy: ['sur', 'ysp']};
  const KURAL = {minAra: 1, maxAra: 5, izinOnce: 3, surGunAsiri: true, isciGece: true};
  const YUVA_AD = {es: 'Ekip şefi', ysp: 'YSP', sur: 'Sürücü'};
  const KOD = {es: 'E', ysp: 'Y', sur: 'S', surG: 'G', surA: 'A'};

  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  const bos = N => Array.from({length: N + 1}, () => ({es: null, ysp: null, sur: null, surG: null, surA: null}));   // 1..N

  // Girdiyi gün indekslerine çevirir. kisi: {id, ad, grup, adet (24 saatlik nöbet), yarim (işçi 12 saatlik adet), izin:[{bas,bit}], istek:[iso]}
  function hazirla(g, kural) {
    const N = g.gun || gunSayisi(g.y, g.m), K = {...KURAL, ...(kural || {})}, ay = `${g.y}-${pad(g.m)}`;
    const gunNo = d => (d && d.slice(0, 7) === ay ? +d.slice(8, 10) : null);
    const P = g.kisiler.map(k => {
      const izin = new Set(), once = new Set(), istek = new Set(), baslar = [];
      (k.izin || []).forEach(i => {
        if (!i.bas || !i.bit) return;

        for (let d = 1; d <= N; d++) { const x = iso(g.y, g.m, d); if (x >= bas && x <= bit) izin.add(d); }

      });

      return {id: k.id, ad: k.ad, grup: k.grup, sinif: k.sinif, yet: YETENEK[k.grup] || ['ysp'], isci: k.grup === 'isci', hedef24: k.adet || 0, hedefYarim: k.yarim || 0, izin, once, istek, baslar};
    });

  }

  // Bir listenin cezası ve ihlalleri
  function denetle(liste, H) {
    const {N, K, P, byId} = H, ihlal = [], ekle = (tur, agirlik, gun, kisi, mesaj, ek) => ihlal.push({tur, agirlik, gun, kisi, mesaj, ...(ek || {})});
    const gorev = new Map(P.map(p => [p.id, []]));         // kişi → [{gun, tip}]
    for (let d = 1; d <= N; d++) {
      const L = liste[d];
      ['es', 'ysp', 'sur', 'surG', 'surA'].forEach(s => { const id = L[s]; if (id != null && byId.has(id)) gorev.get(id).push({gun: d, tip: s}); });
      const surTamam = L.sur != null || (L.surG != null && L.surA != null);
      if (L.es == null) ekle('eksik', 1000, d, null, `${d}. gün ${YUVA_AD.es} nöbet branşı boş`, {yuva: 'es'});
      if (L.ysp == null) ekle('eksik', 1000, d, null, `${d}. gün ${YUVA_AD.ysp} nöbet branşı boş`, {yuva: 'ysp'});
      if (!surTamam) ekle('eksik', 1000, d, null, `${d}. gün ${YUVA_AD.sur} nöbet branşı ${L.surG == null && L.surA == null && L.sur == null ? 'boş' : 'eksik (12 saatlik yarısı boş)'}`, {yuva: 'sur'});
      if (L.sur != null && (L.surG != null || L.surA != null)) ekle('cakisma', 800, d, L.sur, `${d}. gün sürücü nöbet branşında hem 24 saat hem 12 saatlik atama var`);
    }
    P.forEach(p => {
      const L = gorev.get(p.id).slice().sort((a, b) => a.gun - b.gun), gunde = {};
      L.forEach(x => { (gunde[x.gun] = gunde[x.gun] || []).push(x); });
      // yetenek, izin, istek, aynı gün çakışma
      L.forEach(x => {
        const yuva = x.tip === 'surG' || x.tip === 'surA' ? 'sur' : x.tip;
        if (!p.yet.includes(yuva)) ekle('yetenek', 900, x.gun, p.id, `${p.ad}: ${YUVA_AD[yuva]} nöbet branşında görevlendirilemez`);
        if (p.izin.has(x.gun)) ekle('izin', 900, x.gun, p.id, `${p.ad}: ${x.gun}. gün izinli`);
        else if (p.istek.has(x.gun)) ekle('istek', 80, x.gun, p.id, `${p.ad}: ${x.gun}. gün nöbet istemiyor`);
        if (p.once.has(x.gun) && !p.izin.has(x.gun)) ekle('izinOnce', 300, x.gun, p.id, `${p.ad}: yıllık izin öncesi ${K.izinOnce} gün boşluk kuralı (${x.gun}. gün)`);
      });
      Object.keys(gunde).forEach(d => { if (gunde[d].length > 1) ekle('cakisma', 800, +d, p.id, `${p.ad}: ${d}. gün birden fazla nöbet branşında`); });
      // 24 saatlik nöbetler: dinlenme (min boşluk gün) ve sürücü gün aşırı 3
      const g24 = L.filter(x => !(x.tip === 'surG' || x.tip === 'surA')).map(x => x.gun);
      for (let i = 1; i < g24.length; i++) if (g24[i] - g24[i - 1] - 1 < K.minAra) ekle('dinlenme', 700, g24[i], p.id, `${p.ad}: ${g24[i - 1]}. ve ${g24[i]}. gün art arda 24 saatlik nöbet (arada en az ${K.minAra} gün boşluk gerekir)`);
      if (K.surGunAsiri) {
        const s24 = new Set(L.filter(x => x.tip === 'sur').map(x => x.gun));
        s24.forEach(d => { if (s24.has(d + 2) && s24.has(d + 4)) ekle('surGunAsiri', 300, d + 4, p.id, `${p.ad}: ${d}., ${d + 2}., ${d + 4}. gün sürücü olarak gün aşırı üst üste 3 nöbet (24 saat)`); });
      }
      // işçi: art arda 3 gece; gecenin ertesi günü gündüz vardiyası

      }

      const birim = L.filter(x => !(x.tip === 'surG' || x.tip === 'surA')).length + 0.5 * L.filter(x => x.tip === 'surG' || x.tip === 'surA').length, hedef = p.hedef24 + p.hedefYarim / 2;

    });

  const musait = (p, d) => !p.izin.has(d);
  function adayPuani(p, d, durum, yuva, H, R) {
    const {N} = H, son = durum.son[p.id], gap = d - (son == null ? 0 : son) - 1;

  function uygun(p, d, tip, durum, H, rahat) {

  // Açgözlü kurucu: gün gün, yuva yuva
  function kur(H, seed) {
    const {N, P} = H, R = rng(seed), liste = bos(N);
    const durum = {son: {}, kalan24: {}, kalanYarim: {}, bugun: new Set(), gorevler: {}};
    P.forEach(p => { durum.kalan24[p.id] = p.hedef24; durum.kalanYarim[p.id] = p.hedefYarim; durum.gorevler[p.id] = {t24: new Set(), s24: new Set(), A: new Set(), G: new Set()}; });

      for (const rahat of [{}, {istek: true}, {istek: true, once: true}]) {
        const adaylar = P.filter(p => p.yet.includes(yuva) && ((tip === 'surG' || tip === 'surA') ? p.isci : !p.isci) && uygun(p, d, tip, durum, H, rahat));

      const sira = ['es', 'sur', 'ysp'].map(y => [y, P.filter(p => p.yet.includes(y) && !p.izin.has(d) && !p.istek.has(d) && durum.kalan24[p.id] + durum.kalanYarim[p.id] > 0).length]).sort((a, b) => a[1] - b[1]).map(x => x[0]);

            if (L.surG != null) { durum.kalanYarim[L.surG]++; durum.bugun.delete(L.surG); durum.gorevler[L.surG].G.delete(d); L.surG = null; }

          }

  // Yerel iyileştirme: bir atamayı başka uygun kişiyle değiştir ya da iki atamayı takas et
  function iyilestir(liste, H, seed, sureMs) {
    const R = rng(seed + 7), t0 = Date.now(), N = H.N;
    let en = denetle(liste, H), enListe = liste.map(x => ({...x})), mevcut = enListe.map(x => ({...x})), mevcutCeza = en.toplam;
    const yuvalar = ['es', 'ysp', 'sur', 'surG', 'surA'], adayHavuz = {es: H.P.filter(p => p.yet.includes('es') && !p.isci), ysp: H.P.filter(p => p.yet.includes('ysp') && !p.isci), sur: H.P.filter(p => p.yet.includes('sur') && !p.isci), surG: H.P.filter(p => p.isci), surA: H.P.filter(p => p.isci)};
    let iter = 0;
    while (Date.now() - t0 < sureMs && en.toplam > 0) {

      const ih = sonuc.ihlal.filter(i => i.gun > 0), secim = ih.length ? ih[Math.floor(R() * ih.length)] : null;
      let d = secim ? secim.gun : 1 + Math.floor(R() * N), y = yuvalar[Math.floor(R() * yuvalar.length)];
      if (secim && secim.yuva) y = secim.yuva === 'sur' ? (mevcut[d].surG != null || mevcut[d].surA != null ? (mevcut[d].surG == null ? 'surG' : 'surA') : 'sur') : secim.yuva;
      else if (secim && secim.kisi != null) { const L = mevcut[d]; const o = yuvalar.filter(s => L[s] === secim.kisi); if (o.length) y = o[0]; }
      const havuz = adayHavuz[y]; if (!havuz.length) continue;

        yuvalar.forEach(s => { if (s !== y && mevcut[d][s] === yeni) hareket.push([d, s, eski]); });
      } else {                    // başka güne ait bir atamayla takas

        hareket.push([d, y, yeni], [d2, cand[0], eski]);
      }
      const yedek = hareket.map(([dd, s]) => [dd, s, mevcut[dd][s]]);
      hareket.forEach(([dd, s, id]) => { if (id != null && !(adayHavuz[s] || []).some(p => p.id === id)) { /* yetenek uyuşmazlığı denetle'de cezalanır */ } mevcut[dd][s] = id; });
      const yeniCeza = denetle(mevcut, H).toplam;
      if (yeniCeza <= mevcutCeza || R() < 0.01) { mevcutCeza = yeniCeza; if (yeniCeza < en.toplam) { en = {toplam: yeniCeza}; enListe = mevcut.map(x => ({...x})); } }
      else yedek.forEach(([dd, s, id]) => { mevcut[dd][s] = id; });

  }

  // ---- Yeni üretici: sayıları kesin koruyan kurucu + benzetilmiş tavlama ----
  // 1) Nöbet adetleri (24 saatlik: es/ysp/sur; işçi 12 saatlik: surG/surA) akış ile nöbet branşlarına dağıtılır → her kişi tam adedini alır
  // 2) Kişinin nöbetleri ay boyunca eşit aralıklı günlere yerleştirilir

  function uret2(H, seed, sureMs) {
    const {N, P, K} = H, R = rng(seed), m = P.length, t0 = Date.now();
    // işçi yarım vardiyaları aynı gün iki farklı kişi tarafından tutulabilir; bir işçinin yarımları gün sayısını aşıyorsa (tek işçi gibi) fazlası 2 yarım = 1 tam (24 saat) nöbete çevrilir
    const u24 = P.map(p => p.isci ? 0 : p.hedef24), uh = P.map(p => p.isci ? p.hedefYarim : 0);
    let gunIsci = 0;
    for (let tur = 0; tur < 6; tur++) {

      let degisti = false;
      P.forEach((p, i) => { if (p.isci && uh[i] > gunIsci) { const fazla = uh[i] - gunIsci, ceviri = Math.ceil(fazla / 2); uh[i] -= ceviri * 2; if (uh[i] < 0) uh[i] = 0; u24[i] += ceviri; degisti = true; } });

    const isciGun = new Set(); for (let j = 0; j < gunIsci; j++) isciGun.add(1 + Math.floor((j + 0.5) * N / gunIsci));
    const slotD = [], slotT = [], gunSlot = Array.from({length: N + 1}, () => []);
    const ekle = (d, t) => { gunSlot[d].push(slotD.length); slotD.push(d); slotT.push(t); };
    for (let d = 1; d <= N; d++) { ekle(d, 'es'); ekle(d, 'ysp'); if (isciGun.has(d)) { ekle(d, 'surG'); ekle(d, 'surA'); } else ekle(d, 'sur'); }
    const S = slotD.length, cont = new Int16Array(S).fill(-1), place = P.map(() => []);
    const sinif = t => (t === 'surG' || t === 'surA') ? 1 : 0;
    const tipSlot = {}; ['es', 'ysp', 'sur', 'surG', 'surA'].forEach(t => { tipSlot[t] = []; }); for (let s = 0; s < S; s++) tipSlot[slotT[s]].push(s);
    // 1) adetleri nöbet branşlarına dağıt (maksimum akış; her kişi için 24 saatlik ve yarım birimleri ayrı düğüm)
    const tipler = ['es', 'ysp', 'sur', 'surG', 'surA'], need = tipler.map(t => tipSlot[t].length);
    const V = 2 + 2 * m + 5, SRC = 0, SNK = 1, cap = Array.from({length: V}, () => new Array(V).fill(0));
    P.forEach((p, i) => {
      cap[SRC][2 + i] = u24[i]; cap[SRC][2 + m + i] = uh[i];
      tipler.forEach((t, k) => { if (!elig(i, t)) return; const dugum = sinif(t) ? 2 + m + i : 2 + i; cap[dugum][2 + 2 * m + k] = 99; });
    });
    tipler.forEach((t, k) => { cap[2 + 2 * m + k][SNK] = need[k]; });
    for (;;) { const par = new Array(V).fill(-1); par[SRC] = SRC; const q = [SRC]; while (q.length && par[SNK] < 0) { const u = q.shift(); for (let v = 0; v < V; v++) if (par[v] < 0 && cap[u][v] > 0) { par[v] = u; q.push(v); } } if (par[SNK] < 0) break; let f = 1e9; for (let v = SNK; v !== SRC; v = par[v]) f = Math.min(f, cap[par[v]][v]); for (let v = SNK; v !== SRC; v = par[v]) { cap[par[v]][v] -= f; cap[v][par[v]] += f; } }
    const tahsis = P.map((p, i) => tipler.map((t, k) => cap[2 + 2 * m + k][sinif(t) ? 2 + m + i : 2 + i]));
    // 2) her nöbet branşı için kişilerin birimlerini eşit aralıklı hedef zamanlarla sıralayıp slotlara yerleştir
    tipler.forEach((t, k) => {

    const tk = (v, sayi, renk, etiket, ek) => `<div class="ap-click ${f === v ? 'on' : ''}" data-act="pano-filtre" data-v="${v}" title="Tıklayınca bu istasyonlar gösterilir" tabindex="0"><b style="color:${renk}">${sayi}</b><span>${etiket}${ek || ''}</span></div>`;
    const aktif = S.plan.kayitlar.filter(k => !(durumlar()[k.durum] || {}).pasif && !aileHek(k)).length;

      <div class="ap-tw ap-tw-ist"><table class="ap-t ap-ist"><colgroup><col style="width:14.5%"><col style="width:8.5%"><col style="width:6%"><col style="width:10.5%"><col style="width:10.3%"><col style="width:4%"><col style="width:5.8%"><col style="width:3.6%"><col style="width:3.1%"><col style="width:3.3%"><col style="width:4.8%"><col style="width:3.1%"><col style="width:2.2%"><col style="width:9.2%"><col style="width:6%"><col style="width:5.1%"></colgroup><thead><tr><th>AD SOYAD</th><th>ÜNVAN</th><th>SINIF</th><th>NÖBET ROLÜ</th><th>G.GÖREV DURUMU</th><th>İZİN GÜN</th><th>İZİN TÜRÜ</th><th>MESAİ</th><th>HEDEF</th><th>AZAMİ</th><th>PLAN</th><th>FARK</th><th>🔒</th><th>GEÇİCİ GÖREV</th><th>YOLLUK</th><th>İŞLEM</th></tr></thead><tbody>${rows || '<tr><td colspan="16" class="ap-empty">Bu birimde kayıt yok</td></tr>'}</tbody></table></div>${silinenHtml(b, duz)}`;
  }

  function gorevHtml() {

    const rows = gk.map(k => {

      <td><select class="ap-sel" data-id="${k.id}" data-f="gHedef" ${duz ? '' : 'disabled'}>${opts(k)}</select>${k.gorev.hedef ? '' : `<div class="ap-note">${esc(k.gorev.yer || '')}</div>`}</td>
      <td style="min-width:235px"><input class="ap-in w" style="min-width:225px;font-variant-numeric:tabular-nums" title="${esc(k.gorev.tarih || '')}" data-id="${k.id}" data-f="gTarih" value="${esc(k.gorev.tarih || '')}" ${duz ? '' : 'disabled'}></td>
      <td><select class="ap-sel" data-id="${k.id}" data-f="yolluk" ${duz ? '' : 'disabled'}>${['', 'YOLLUKLU', 'YOLLUKSUZ'].map(a => `<option ${a === (k.gorev.yolluk || '') ? 'selected' : ''}>${a}</option>`).join('')}</select></td>
      <td><select class="ap-sel" data-id="${k.id}" data-f="gGerekce" ${duz ? '' : 'disabled'}>${GEREKCE.map(a => `<option ${a === (k.gorev.gerekce || '') ? 'selected' : ''}>${a}</option>`).join('')}</select></td>

    }).join('');
    // basit eşleştirme önerisi
    const oner = []; let fz = fazla.map(x => ({ad: x.b.ad, k: x.h.fazlaEf})), ac = acik.map(x => ({ad: x.b.ad, k: x.h.hedefAcik}));
    for (const a of ac) for (const f of fz) { const m = Math.min(a.k, f.k); if (m >= 4) { oner.push(`${f.ad} → ${a.ad}: yaklaşık ${fmt(m)} nöbet (≈ ${Math.max(1, Math.round(m / 7.5))} kişi)`); a.k -= m; f.k -= m; } }
    // Dağıtım sonucu: önerilen rotasyon tüm istasyonlara uygulanınca hâlâ personel bekleyen istasyonlar. Fazla nöbetle kapanan istasyonlara personel gönderilmez; kalan açık fazla nöbetle kapanır.
    const rotOner = rotasyonOneriler(), gidenSay = {}; rotOner.forEach(o => { if (o.hedef) gidenSay[o.hedef] = (gidenSay[o.hedef] || 0) + 1; });
    const karsilanamayan = acik.filter(x => x.h.ihtiyacTur === 'oner' && x.h.ihtiyacKisi > (gidenSay[x.b.ad] || 0)), fazlaIleDolan = [...ic].filter(x => x.h.ihtiyacTur === 'icerde');
    const dagitimOzet = `<div class="ap-ek ap-ek-c" style="margin:8px 0"><b>Dağıtım sonucu:</b> ${rotOner.filter(o => o.hedef).length} kişi gerçekten ihtiyacı olan istasyonlara yönlendirildi. ${karsilanamayan.length ? `<b>${karsilanamayan.length} istasyonun ihtiyacı karşılanamadı</b> (${karsilanamayan.slice(0, 8).map(x => `${esc(x.b.ad)} −${x.h.ihtiyacKisi - (gidenSay[x.b.ad] || 0)} kişi`).join(', ')}${karsilanamayan.length > 8 ? ' …' : ''}); kalan açık o istasyonlarda fazla nöbetle kapanır.` : 'Personel bekleyen istasyon kalmadı.'} ${fazlaIleDolan.length ? `Fazla nöbetle kapanan ${fazlaIleDolan.length} istasyona (açığı bir kişiye yetmiyor) personel gönderilmez.` : ''}</div>`;
    const degerlendirme = `<div class="ap-card"><h2>Personel ihtiyacı değerlendirmesi — ${ayEtiket()}</h2>
      ${dagitimOzet}
      <p class="ap-note">${S.ayar.panoMod === 'mesai' ? 'Mod: <b>Mesai karşılığı</b>. Ölçüt: kişiler yalnız hedef nöbetlerini tutarsa istasyon açık kalıyorsa ve bu açık, gelen bir kişinin mesaisini orada tamamlamasına yetiyorsa personel önerilir.' : `Mod: <b>Fazla mesaili</b> (memur/doktor en çok ${fmt(S.ayar.azamiMemur)} nöbet). Ölçüt: fazla nöbet yazıldıktan sonra da istasyon açık kalıyorsa ve bu açık, gelen bir kişinin mesaisini tamamlamasına yetiyorsa personel önerilir; fazla nöbetle kapanıyorsa önerilmez.`} İsterseniz aşağıdaki "Görevlendirmeler" bölümünden elle görevlendirme yapabilirsiniz.</p>
      <div class="ap-tw"><table class="ap-t"><thead><tr><th>İSTASYON</th><th>MESAİ KARŞILIĞI AÇIK</th>${S.ayar.panoMod === 'mesai' ? '' : '<th>FAZLA NÖBETLE AÇIK</th>'}<th>KAÇ KİŞİ GEREKİR</th><th>DEĞERLENDİRME</th></tr></thead><tbody>
      ${[...acik, ...ic].map(x => `<tr><td><b>${esc(x.b.ad)}</b></td><td class="num">${fmt(x.h.hedefAcik)}</td>${S.ayar.panoMod === 'mesai' ? '' : `<td class="num">${fmt(Math.max(0, x.h.acikEf))}</td>`}<td class="num">${x.h.ihtiyacKisi}</td>
      <td>${x.h.ihtiyacTur === 'oner' ? `<span class="ap-tag ap-t-ih">Personel öner: ${x.h.ihtiyacKisi} kişi</span>${x.h.kalanAcik > 0 ? ` <span class="ap-note">+ ${fmt(x.h.kalanAcik)} nöbet fazla nöbetle</span>` : ''}` : x.h.ihtiyacTur === 'icerde' ? '<span class="ap-tag ap-t-fz">Fazla nöbetle kapanır — personel önerilmez</span>' : `<span class="ap-tag" style="background:#ffedd5;color:#9a3412">${S.ayar.panoMod === 'mesai' ? 'Açık kalıyor (bir kişiyi doldurmaz)' : 'Elle karar'}</span>`}</td></tr>`).join('') || `<tr><td colspan="${S.ayar.panoMod === 'mesai' ? 4 : 5}" class="ap-empty">Açık veren istasyon yok</td></tr>`}</tbody></table></div></div>`;
    const sekme = S.gorevSekme || 'deg';
    const sekmeler = [['deg', 'Personel ihtiyacı değerlendirmesi'], ['rot', 'Aylık rotasyon'], ['list', `Görevlendirmeler (${gk.length})`], ['ozet', 'Açık / fazla istasyonlar']];
    const nav = `<div class="ap-subnav ap-noprint">${sekmeler.map(([v, t]) => `<button class="${sekme === v ? 'on' : ''}" data-act="gorev-sekme" data-v="${v}">${t}</button>`).join('')}</div>`;
    const ozet = `<div class="ap-two"><div class="ap-card"><h2>Personel önerilen istasyonlar (${acik.length})</h2>${acik.map(x => `<div class="ap-row"><b>${esc(x.b.ad)}</b><span class="ap-tag ap-t-ih">${x.h.ihtiyacKisi} kişi · ${fmt(x.h.hedefAcik)} nöbet açık</span></div>`).join('') || '<span class="ap-note">Yok</span>'}</div>
      <div class="ap-card"><h2>Mesai tamamlayamayan istasyonlar (${fazla.length})</h2>${fazla.map(x => `<div class="ap-row"><b>${esc(x.b.ad)}</b><span class="ap-tag ap-t-fz">${fmt(x.h.fazlaH)} nöbet fazla</span></div>`).join('') || '<span class="ap-note">Yok</span>'}</div></div>
      ${oner.length ? `<div class="ap-card"><h2>Eşleştirme önerisi</h2>${oner.map(t => `<div>${esc(t)}</div>`).join('')}<div class="ap-note">Öneri yalnızca büyüklük gösterir. Kişi seçerken 4/B kuralı (4 yıl dolmadan başka istasyona görevlendirme yasak) otomatik denetlenir.</div></div>` : ''}
`;
    const liste = `<div class="ap-card"><div class="ap-row"><h2 style="margin:0">Görevlendirmeler (${gk.length})</h2>
      <input class="ap-in" list="ap-kisi-list" id="ap-g-kisi" placeholder="Kişi ara…"><datalist id="ap-kisi-list">${S.plan.kayitlar.filter(k => !k.gorev || !k.gorev.hedef).slice(0, 2000).map(k => `<option value="${esc(k.ad)}">`).join('')}</datalist>
      <select class="ap-sel" id="ap-g-hedef">${birimler.map(b => `<option>${esc(b.ad)}</option>`).join('')}</select>
      <button class="ap-btn pri" data-act="g-ekle" ${duz ? '' : 'disabled'}>Görevlendir</button></div>
      <div class="ap-tw"><table class="ap-t"><thead><tr><th>AD SOYAD</th><th>ÜNVAN</th><th>KAYNAK</th><th>HEDEF</th><th>TARİH</th><th>YOLLUK</th><th>GEREKÇE</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="ap-empty">Görevlendirme yok</td></tr>'}</tbody></table></div></div>`;
    return nav + ({deg: degerlendirme, rot: sekme === 'rot' ? rotasyonHtml() : '', ozet, list: liste}[sekme] || degerlendirme);
  }
  function personelHtml() {
    const D = durumlar(), f = S.filtre, q = C.TR(f.q);
    let liste = S.plan.kayitlar.filter(k => (!f.durum || k.durum === f.durum || (f.durum === '_izin' && izinGun(k) > 0)) && (!f.birim || k.birim === f.birim) && (!f.sinif || k.sinif === f.sinif) && (!f.surucu || (k.sinif === 'memur' && C.kadroTip(k) === 'ATT' && C.surucuDurumu(k, {degil: S.ayar.surDegilEsik / 100}).tip === f.surucu)) && (!q || C.TR(k.ad + ' ' + (k.tc || '')).includes(q)));
    const boyut = S.pBoyut || 50, sayfaSay = Math.max(1, Math.ceil(liste.length / boyut)); if (S.pSayfa >= sayfaSay) S.pSayfa = sayfaSay - 1; if (S.pSayfa < 0) S.pSayfa = 0;
    const bas = S.pSayfa * boyut, gos = liste.slice(bas, bas + boyut);
    const rows = gos.map(k => {
      const dy = k.dortB && k.memBas ? C.dortYilDurum(k.memBas, ayIlk()) : null;
      return `<tr><td>${esc(k.ad)}${k.asosYok ? ' <span class="ap-tag ap-t-fz" title="ASOS listelerinde bulunamadı">ASOS\'ta yok</span>' : ''}</td><td>${esc(k.tc || '')}</td><td>${esc(k.unvan)}${k.dortB ? ' <span class="ap-tag ap-t-fz">4/B</span>' : ''}</td><td>${SINIF_AD[k.sinif] || ''}</td><td>${esc(k.birim)}</td><td>${C.GRUP_AD[C.grupBelirle(k, {degil: S.ayar.surDegilEsik / 100}, S.ayar)]}${k.rolManuel ? ' (elle)' : ''}</td><td>${(() => { if (k.sinif !== 'memur' || C.kadroTip(k) !== 'ATT') return ''; const sd = C.surucuDurumu(k, {degil: S.ayar.surDegilEsik / 100}); return sd.tip === 'surucu' ? `Sürücü${sd.kaynak === 'kayit' ? ' (%' + Math.round(100 * sd.pay) + ')' : ' (elle)'}` : sd.tip === 'degil' ? 'Sürücü değil' : '<span class="ap-tag ap-t-fz">Doğrulanmadı</span>'; })()}</td><td>${esc(durumGosterim(k))}</td>
      <td>${k.memBas ? k.memBas.split('-').reverse().join('.') : ''}${k.dortB && !k.memBas ? '<span class="ap-tag ap-t-ih">tarih yok</span>' : ''}</td><td>${dy ? (dy.uygun ? 'Uygun' : esc(dy.dolum.split('-').reverse().join('.'))) : ''}</td><td class="num">${k.yillikKalan != null ? fmt(k.yillikKalan) : ''}</td></tr>`;
    }).join('');
    const pager = () => { const dugme = (v, t, on, dis) => `<button class="ap-btn sm ${on ? 'on' : ''}" data-act="p-git" data-v="${v}" ${dis ? 'disabled' : ''}>${t}</button>`;
      const p = S.pSayfa, bas0 = Math.max(0, Math.min(p - 3, sayfaSay - 7)), nums = []; for (let i = bas0; i < Math.min(sayfaSay, bas0 + 7); i++) nums.push(dugme(i, i + 1, i === p));

        <span class="ap-note">${liste.length ? bas + 1 : 0}–${Math.min(liste.length, bas + boyut)} / ${liste.length} · Sayfa ${p + 1}/${sayfaSay}</span>
        <select class="ap-sel" data-act="p-boyut">${[25, 50, 100, 200].map(n => `<option value="${n}" ${n === boyut ? 'selected' : ''}>${n} / sayfa</option>`).join('')}</select></div>`; };
    return `<div class="ap-row ap-noprint"><button class="ap-btn pri" data-act="plan-asos" ${salt() ? 'disabled' : ''} title="Personel Listesi Raporu ve EKİP listesini birlikte seçebilirsiniz">Personel listelerini yükle</button>
      <input class="ap-in" data-act="f-q" placeholder="Ad veya TC ara" value="${esc(f.q)}">

      <select class="ap-sel" data-act="f-sinif"><option value="">Tüm sınıflar</option>${Object.entries(SINIF_AD).map(([a, t]) => `<option value="${a}" ${a === f.sinif ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select class="ap-sel" data-act="f-surucu" title="ATT sürücülüğü"><option value="">ATT sürücülüğü: tümü</option><option value="dogrulanmadi" ${f.surucu === 'dogrulanmadi' ? 'selected' : ''}>Doğrulanmadı</option><option value="surucu" ${f.surucu === 'surucu' ? 'selected' : ''}>Sürücü</option><option value="degil" ${f.surucu === 'degil' ? 'selected' : ''}>Sürücü değil</option></select>
      <select class="ap-sel" data-act="f-durum"><option value="">Tüm durumlar</option><option value="_izin" ${f.durum === '_izin' ? 'selected' : ''}>İzinli</option>${Object.keys(D).map(a => `<option ${a === f.durum ? 'selected' : ''}>${a}</option>`).join('')}</select>
      <span class="ap-note">${liste.length} kayıt${S.plan.disKurum && S.plan.disKurum.length ? ` · Dış kurum: ${S.plan.disKurum.length}` : ''}</span></div>
      ${pager()}<div class="ap-tw"><table class="ap-t"><thead><tr><th>AD SOYAD</th><th>TC</th><th>ÜNVAN</th><th>SINIF</th><th>BİRİM</th><th>NÖBET ROLÜ</th><th>SÜRÜCÜLÜK</th><th>DURUM</th><th>GÖREV BAŞLANGICI</th><th>4/B 4 YIL DOLUMU</th><th>YILLIK İZİN KALAN</th></tr></thead><tbody>${rows || '<tr><td colspan="11" class="ap-empty">Kayıt yok</td></tr>'}</tbody></table></div>${pager()}`;
  }

  function ozelHtml() {

    const tatil = []; for (let d = 1; d <= C.gunSayisi(S.y, S.m); d++) { const i = C.iso(S.y, S.m, d), w = C.RESMI[i]; if (w !== undefined) tatil.push(`${i.split('-').reverse().join('.')} ${w === 'A' ? '(arife, 5 saat)' : '(resmî tatil)'}`); }

  function istatistik() {
    const D = durumlar(), K = S.plan.kayitlar.filter(k => !(D[k.durum] || {}).pasif && !aileHek(k)), say = {};
    const inc = (a, n = 1) => { say[a] = (say[a] || 0) + n; };
    K.forEach(k => {
      inc('toplam'); inc('sinif:' + k.sinif); if (k.durum) inc('durum:' + k.durum);
      if (izinGun(k) > 0) { inc('izinli'); inc('izinGun', izinGun(k)); (k.izin || []).forEach(i => { if (sayi(i.gun) > 0) inc('izinTur:' + (i.tur || 'Belirtilmemiş'), sayi(i.gun)); }); }
      if (k.gorev && (k.gorev.hedef || k.gorev.yer)) { inc('gorev'); inc('yolluk:' + (k.gorev.yolluk || 'Belirtilmemiş')); }
      if (k.dortB) inc('dortB');
    });
    return {say, K};
  }

      <p class="ap-note">Yedek dosyasında kişisel veri bulunur; güvenli yerde saklayın. Şifreli ortak Drive arşivi sonraki sürümde eklenecek.</p></div>`;

  function sayfaHtml() {
    if (S.modul === 2) return n2Html();
    if (!S.plan) return bosHtml();
    return ({pano: panoHtml, ist: istHtml, gorev: gorevHtml, personel: personelHtml, ozel: ozelHtml, stat: statHtml, talep: talepHtml, log: logHtml, ayar: ayarHtml, arsiv: arsivHtml, arstat: arstatHtml}[S.sayfa] || panoHtml)();
  }
  function render() {
    const sy = window.scrollY, tw = root.querySelector('.ap-tw'), sl = tw ? tw.scrollLeft : 0, st = tw ? tw.scrollTop : 0;
    const koyu = S.ayar && (S.ayar.tema === 'koyu' || (S.ayar.tema === 'sistem' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
    root.className = 'ap-root' + (koyu ? ' ap-dark' : ''); document.body.style.background = koyu ? '#0f1720' : '#f4f6f9';
    if (S.rol === 'istasyon') S.modul = 2;
    root.innerHTML = ustHtml() + (S.plan || S.modul === 2 ? navHtml() : '') + `<div class="ap-main">${sayfaHtml()}</div>` + (S.modal ? S.modal() : '');
    // Sayı sütunları: tüm hücreleri sayı olan sütunun başlığı ve hücreleri sağa yaslanır (başlık ile sayı aynı hizada)
    root.querySelectorAll('table').forEach(t => {
      const ths = [...t.querySelectorAll('thead th')]; if (!ths.length) return;
      const rows = [...t.querySelectorAll('tbody tr')].filter(r => r.children.length === ths.length);
      ths.forEach((th, i) => {
        const hucre = rows.map(r => r.children[i]), dolu = hucre.map(c => (c.querySelector('input,select') ? (c.querySelector('input,select').value || '') : (c.textContent || '')).trim()).filter(v => v !== '');
        if (!dolu.length || th.classList.contains('num') && hucre.every(c => c.classList.contains('num'))) return;
        const sayisal = dolu.every(v => /^[−+-]?\d{1,7}([.,]\d+)?$/.test(v)) && !(hucre.some(c => c.querySelector('select')));
        if (sayisal || hucre.every(c => c.classList.contains('num') || !(c.textContent || '').trim())) { th.classList.add('num'); hucre.forEach(c => c.classList.add('num')); }
      });
    });
    toastCiz();
    const tw2 = root.querySelector('.ap-tw'); if (tw2) { tw2.scrollLeft = sl; tw2.scrollTop = st; }
    window.scrollTo(0, sy);
  }

  // ================= MODÜL 1 — ARŞİV VE ARŞİV İSTATİSTİKLERİ =================
  const bransAd = k => k.sinif === 'doktor' ? 'Doktor' : k.sinif === 'isci' ? 'İşçi' : C.kadroTip(k);
  const BRANSLAR = ['AABT', 'ATT', 'Doktor', 'İşçi'];
  const arsivAnahtar = ay => 'arsiv:' + ay;
  const ayAd = ay => { const [y, m] = ay.split('-'); return `${AYLAR[+m]} ${y}`; };

  // Bir planın aylık özeti (kişisel veri içermez: TC, sağlık, telefon yok; yalnız ad ve branş)
  function ayMetrik(plan, y, m) {
    const D = durumlar(), ist = {};
    plan.birimler.filter(b => b.tur === 'istasyon').forEach(b => {
      const h = hesaplaCtx(plan, y, m, b), aktif = h.satir.filter(s => !s.nobetYok);
      const planlanan = aktif.reduce((a, s) => a + sayi(s.k.planlanan), 0);
      const cikan = plan.kayitlar.filter(k => k.birim === b.ad && (D[k.durum] || {}).disarida && k.gorev && k.gorev.hedef && k.gorev.hedef !== b.ad)
        .map(k => ({ad: k.ad, brans: bransAd(k), hedef: k.gorev.hedef, uzun: !!k.gorev.uzun}));
      const gelen = h.satir.filter(s => s.k._gelen).map(s => ({ad: s.k.ad, brans: bransAd(s.k), kaynak: s.k.birim}));
      const fazla = aktif.map(s => ({ad: s.k.ad, brans: bransAd(s.k), planlanan: sayi(s.k.planlanan), hedef: s.hedef, fazla: Math.round((sayi(s.k.planlanan) - s.hedef) * 100) / 100})).filter(x => x.fazla > 0.01);
      ist[b.ad] = {of: !!b.ekipOf, ihtiyac: h.ihtiyac, kapasite: h.kapasite, azami: h.azamiKap, planlanan: Math.round(planlanan * 100) / 100, kisi: aktif.length,
        fazlaMesai: Math.round(fazla.reduce((a, x) => a + x.fazla, 0) * 100) / 100, fazlaH: h.fazlaH, hedefAcik: h.hedefAcik, ihtiyacTur: h.ihtiyacTur, ihtiyacKisi: h.ihtiyacKisi, durum: h.durum, cikan, gelen, fazla};
    });
    return {ay: `${y}-${C.pad(m)}`, zaman: Date.now(), hesapImza: hesapImza(), ist};
  }
  // Hesap imzası: hesaplama sürümü + sonucu etkileyen ayarlar. Değişirse arşivdeki aylar yeni yönteme göre arka planda yeniden hesaplanır.
  const hesapImza = () => JSON.stringify([HESAP_SURUM, S.ayar.isciDusulen, S.ayar.azamiMemur, S.ayar.panoMod, S.ayar.surEsik, S.ayar.surDegilEsik, Object.entries(S.ayar.durumlar).map(([k, v]) => [k, !!v.nobetYok, !!v.mesaiYok, !!v.disarida, !!v.pasif])]);
  // Arşivlenmiş bir ayın planını (kopya üzerinde) güncel yöntemle yeniden hesaplar; kayıtlı plana dokunulmaz
  function planiYenidenHesapla(plan, y, m) {
    const kopya = JSON.parse(JSON.stringify(plan)), yedek = {plan: S.plan, y: S.y, m: S.m, toplu: S.toplu};
    try { S.plan = kopya; S.y = y; S.m = m; S.toplu = true; kopya.birimler.filter(b => b.tur === 'istasyon').forEach(b => oner(b.ad)); return ayMetrik(kopya, y, m); }
    finally { S.plan = yedek.plan; S.y = yedek.y; S.m = yedek.m; S.toplu = yedek.toplu; }
  }
  // Arka plan: imzası eski olan arşiv aylarını sırayla (arayüzü kilitlemeden) yeniler
  async function arsivArkaPlan() {
    if (!S.ayar) return;
    if (S.arsivCalisiyor) { S.arsivTekrar = true; return; }
    S.arsivCalisiyor = true;
    try {
      const v = S.arsivVeri || await arsivYukle(), imza = hesapImza(); let n = 0, yok = 0;
      for (const ay of Object.keys(v).sort()) {
        const rec = v[ay]; if (rec.hesapImza === imza) continue;
        const [y, m] = ay.split('-').map(Number);
        const plan = (S.plan && `${S.y}-${C.pad(S.m)}` === ay) ? S.plan : await depo.get(anahtar(y, m));
        if (!plan) { yok++; continue; }
        await new Promise(r => setTimeout(r, 30));
        const yeni = planiYenidenHesapla(plan, y, m); yeni.zaman = rec.zaman; yeni.yenilendi = Date.now();
        await arsivYaz(yeni); n++;
      }
      if (n) { toast(`${n} arşiv ayı güncel hesaplama yöntemine göre yeniden hesaplandı.`); render(); }
      S.arsivPlanYok = yok;
    } catch (er) { console.error(er); }
    finally { S.arsivCalisiyor = false; if (S.arsivTekrar) { S.arsivTekrar = false; setTimeout(() => arsivArkaPlan(), 300); } }
  }
  // Yüklenen dosya günlüğü (Arşiv sayfasında gösterilir): hangi dosya, hangi tür, kaç satır, hangi aya uygulandı
  const DOSYA_TUR = {A: 'EKİP Personel Listesi', B: 'Personel Listesi Raporu', I: 'Personel İzin-Muafiyet Raporu', N: 'Nöbet Listesi / Hareket Raporu'};
  async function yuklemeKaydet(dosyalar) {
    const l = (await depo.get('yuklemeler')) || [], t = Date.now();
    dosyalar.forEach(d => {
      const r = d.rapor, ozet = d.tur === 'I' ? `${r.kisi} kişi, ${r.eslesen} eşleşti · ${r.izinli} izinli, ${r.muafiyet} muafiyet` : d.tur === 'N' ? `${r.kisi} kişi, ${r.eslesen} eşleşti · aylar: ${(r.aylar || []).join(', ')}` : `${r.yeni.length} yeni, ${r.degisen} güncel${r.nakil && r.nakil.length ? ', ' + r.nakil.length + ' birim değişikliği' : ''}`;
      l.unshift({t, ad: d.ad, tur: d.tur, satir: r.toplam, boyut: d.boyut || 0, ay: ayAnahtari(), rol: S.rol, ozet});
    });
    if (l.length > 500) l.length = 500;
    await depo.put('yuklemeler', l); S.yuklemeler = l;
  }
  async function arsivYukle() {
    S.yuklemeler = (await depo.get('yuklemeler')) || [];
    const anahtarlar = ((await depo.keys()) || []).filter(k => String(k).startsWith('arsiv:')).sort(), v = {};
    for (const k of anahtarlar) { const r = await depo.get(k); if (r && r.ay) v[r.ay] = r; }
    const gk = ((await depo.keys()) || []).filter(k => String(k).startsWith('gercek:')).sort(), g = {};
    for (const k of gk) { const r = await depo.get(k); if (r && r.ay) g[r.ay] = r; }
    S.gercekVeri = g; S.arsivVeri = v; S.arsivSecili = S.arsivSecili || []; S.arsivBilinen = S.arsivBilinen || new Set();
    [...new Set([...Object.keys(v), ...Object.keys(g)])].sort().forEach(a => { if (!S.arsivBilinen.has(a)) { S.arsivBilinen.add(a); S.arsivSecili.push(a); } });      // yeni gelen aylar otomatik seçilir
    return v;
  }
  async function arsivYaz(rec) { await depo.put(arsivAnahtar(rec.ay), rec); (S.arsivVeri = S.arsivVeri || {})[rec.ay] = rec; if (S.arsivSecili && !S.arsivSecili.includes(rec.ay)) S.arsivSecili.push(rec.ay); }
  function arsivToplam(rec) {
    const o = {ihtiyac: 0, planlanan: 0, kapasite: 0, cikan: 0, gelen: 0, fazla: 0, oner: 0, of: 0};
    Object.values(rec.ist).forEach(i => { if (i.of) { o.of++; return; } o.ihtiyac += i.ihtiyac; o.planlanan += i.planlanan; o.kapasite += i.kapasite; o.cikan += i.cikan.length; o.gelen += i.gelen.length; o.fazla += i.fazlaMesai; if (i.ihtiyacTur === 'oner') o.oner++; });
    return o;
  }
  const tabloHtml = (bas, sat, ek) => `<div class="ap-tw"><table class="ap-t ${ek || ''}"><thead><tr>${bas.map((b, i) => `<th${sat.length && typeof sat[0][i] === 'number' ? ' class="num"' : ''}>${b}</th>`).join('')}</tr></thead><tbody>${sat.map(r => `<tr>${r.map((c, i) => `<td${typeof c === 'number' ? ' class="num"' : ''}>${typeof c === 'number' ? fmt(c) : c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${bas.length}" class="ap-empty">Kayıt yok</td></tr>`}</tbody></table></div>`;

  // Her ay yüklenecek dosyalar: en az sayıda ASOS dosyası (3 dosya) ve bu ay için durumu
  function dosyaDurumHtml() {
    const ay = ayAnahtari(), yl = (S.yuklemeler || []).filter(x => x.ay === ay), var_ = t => yl.some(x => x.tur === t);
    const durum = ok => ok ? '<span class="ap-tag ap-t-ok">yüklendi</span>' : '<span class="ap-tag ap-t-ih">bekleniyor</span>';
    const nobetAy = (S.plan && S.plan.nobetAylari) || [];
    const sat = [
      ['1', '<b>EKİP — Başhekimlik / Komuta / İstasyon Personel Listesi</b>', 'Kim hangi istasyonda çalışıyor, çalışma durumu, yıllık izin bakiyesi. Doktorlar dahil tüm ekibi içerir: yalnız Personel Listesi Raporu ile ~58 kişi (çoğu doktor) eksik kalır.', var_('A')],
      ['2', '<b>Personel Listesi Raporu</b>', 'İzin, rapor, muafiyet, süt izni, geçici görev yeri ve tarihleri, atama başlangıç tarihi (4/B 4 yıl kuralı). İzin-Muafiyet Raporu aynı bilgiyi içerir; ayrıca yüklemeye gerek yok.', var_('B') || var_('I')],
      ['3', '<b>Nöbet Listesi Raporu</b> (ya da Nöbet İçi Hareket Raporu)', `Kişinin ekip şefi / YSP / sürücü olarak tuttuğu nöbetler: sürücülük doğrulaması ve gerçekleşen nöbetler. İkisi aynı bilgiyi verir, <b>birini yüklemeniz yeterli</b>. Son 6 ay birlikte değerlendirilir; yüklü nöbet ayları: ${nobetAy.length ? nobetAy.map(a => ayAd(a)).join(', ') : 'yok'}.`, var_('N') || nobetAy.length > 0]];
    return `<div class="ap-card"><h2>Her ay yüklenecek dosyalar — ${ayEtiket()}</h2><p class="ap-note">Sistem yalnızca <b>3 ASOS dosyasıyla</b> çalışır. Her ay planlama öncesi bu üçünü yenilemeniz yeterlidir; arşiv ve istatistikler bunlardan ve planlamadan otomatik üretilir.</p>
      ${tabloHtml(['#', 'Dosya', 'Ne için gerekli', 'Bu ay'], sat.map(r => [r[0], r[1], `<span class="ap-note">${r[2]}</span>`, durum(r[3])]))}
      <details style="margin-top:8px"><summary class="ap-note">Yüklemeniz gerekmeyen dosyalar</summary><ul class="ap-note" style="line-height:1.7"><li><b>Personel İzin-Muafiyet Raporu:</b> Personel Listesi Raporu ile aynı izin/muafiyet bilgisini verir. Yalnızca bir kişinin aynı ay içinde birden çok izni olduğunda ek ayrıntı sağlar (isteğe bağlı).</li><li><b>Nöbet İçi Hareket Raporu:</b> Nöbet Listesi Raporu ile aynı bilgiyi içerir; ikisini birden yüklemek gerekmez.</li><li><b>Nöbet Listesi Döküm Cetveli:</b> Gün gün saat bilgisi verir ama ekip şefi / YSP / sürücü bilgisini içermez; şu an kullanılmıyor (ileride fazla mesai bakiyesi için değerlendirilebilir).</li></ul></details></div>`;
  }
  function arsivHtml() {
    if (S.arsivVeri === null) { if (!S.arsivYuk) { S.arsivYuk = true; arsivYukle().then(() => { S.arsivYuk = false; render(); }); } return '<div class="ap-card">Arşiv yükleniyor…</div>'; }

      ${var_ ? `<div class="ap-note" style="margin-top:8px">${ayEtiket()} son arşivleme: ${new Date(var_.zaman).toLocaleString('tr-TR')}</div>` : ''}</div>

      aylar.map(a => { const r = S.arsivVeri[a], t = arsivToplam(r); return [ayAd(a), new Date(r.zaman).toLocaleDateString('tr-TR'), t.ihtiyac, t.planlanan, t.cikan, t.gelen, t.fazla, t.oner, r.hesapImza === hesapImza() ? (r.yenilendi ? `<span class="ap-note" title="Güncel yönteme göre yeniden hesaplandı">güncellendi ${new Date(r.yenilendi).toLocaleDateString('tr-TR')}</span>` : 'güncel') : '<span class="ap-note" style="color:var(--ap-warn)" title="Bu ayın planı bu tarayıcıda yoksa eski yöntemle kalır">eski hesap</span>', S.rol === 'yonetici' ? `<button class="ap-btn sm dng" data-act="arsiv-sil" data-v="${a}">Sil</button>` : '']; }))}</div>` + yuklemeHtml;
  }

  // ---- istatistik: seçilen aylar ----
  function arsivIstatistik() {
    const sec = (S.arsivSecili || []).filter(a => S.arsivVeri[a]).sort(), f = S.arsivIst, ayN = sec.length;
    const recs = sec.map(a => S.arsivVeri[a]), adlar = new Set();
    recs.forEach(r => Object.keys(r.ist).forEach(a => adlar.add(a)));
    const ister = ad => !f || ad === f;
    const seyir = recs.map(r => { const t = arsivToplam(r); return [ayAd(r.ay), t.ihtiyac, t.planlanan, t.kapasite, t.cikan, t.gelen, t.fazla, t.oner]; });
    const ist = [...adlar].filter(ister).sort(trCollator.compare).map(ad => {
      const o = {ad, ay: 0, ihtiyac: 0, planlanan: 0, cikan: 0, gelen: 0, fazla: 0, fazlaKisi: 0, oner: 0, of: 0};
      recs.forEach(r => { const i = r.ist[ad]; if (!i) return; if (i.of) { o.of++; return; } o.ay++; o.ihtiyac += i.ihtiyac; o.planlanan += i.planlanan; o.cikan += i.cikan.length; o.gelen += i.gelen.length; o.fazla += i.fazlaMesai; o.fazlaKisi += i.fazla.length; if (i.ihtiyacTur === 'oner') o.oner++; });
      return [ad, o.ay, o.ihtiyac, o.planlanan, o.cikan, o.gelen, o.fazla, o.fazlaKisi, o.oner, o.of];
    });
    // çıkan personel: kişi başına kaç ay çıktı
    const cik = new Map(), gel = new Map(), faz = new Map(), mat = {};
    recs.forEach(r => Object.entries(r.ist).forEach(([ad, i]) => {
      i.cikan.forEach(x => { if (!ister(ad)) return; const a = `${x.ad}|${ad}`; const e = cik.get(a) || {ad: x.ad, brans: x.brans, kaynak: ad, hedefler: new Set(), aylar: []}; e.hedefler.add(x.hedef); e.aylar.push(r.ay); cik.set(a, e); });
      i.gelen.forEach(x => { if (!ister(ad)) return; const a = `${x.ad}|${ad}`; const e = gel.get(a) || {ad: x.ad, brans: x.brans, hedef: ad, kaynaklar: new Set(), aylar: []}; e.kaynaklar.add(x.kaynak); e.aylar.push(r.ay); gel.set(a, e); (mat[ad] = mat[ad] || {})[x.brans] = (mat[ad][x.brans] || 0) + 1; });
      i.fazla.forEach(x => { if (!ister(ad)) return; const a = `${x.ad}|${ad}`; const e = faz.get(a) || {ad: x.ad, brans: x.brans, ist: ad, aylar: [], toplam: 0}; e.aylar.push(r.ay); e.toplam += x.fazla; faz.set(a, e); });
    }));
    const kisaAy = a => a.slice(2).replace('-', '/');
    const cikSat = [...cik.values()].sort((a, b) => b.aylar.length - a.aylar.length || trCollator.compare(a.ad, b.ad)).map(e => [esc(e.ad), e.brans, esc(e.kaynak), esc([...e.hedefler].join(', ')), e.aylar.length, e.aylar.map(kisaAy).join(', ')]);
    const gelSat = [...gel.values()].sort((a, b) => trCollator.compare(a.hedef, b.hedef) || trCollator.compare(a.ad, b.ad)).map(e => [esc(e.ad), e.brans, esc([...e.kaynaklar].join(', ')), esc(e.hedef), e.aylar.length, e.aylar.map(kisaAy).join(', ')]);
    const fazSat = [...faz.values()].sort((a, b) => b.toplam - a.toplam || trCollator.compare(a.ad, b.ad)).map(e => [esc(e.ad), e.brans, esc(e.ist), e.aylar.length, e.toplam, e.aylar.map(kisaAy).join(', ')]);
    const matSat = Object.keys(mat).sort(trCollator.compare).map(ad => [esc(ad), ...BRANSLAR.map(b => mat[ad][b] || 0), BRANSLAR.reduce((x, b) => x + (mat[ad][b] || 0), 0)]);
    return {ayN, seyir, ist, cikSat, gelSat, fazSat, matSat, adlar: [...adlar].sort(trCollator.compare)};
  }
  // Gerçekleşen nöbetler (Nöbet Listesi Raporundan): planlananla karşılaştırma, fazla nöbet, kadrosu dışında tutulan nöbet
  function gercekIstatistik() {
    const g = S.gercekVeri || {}, f = S.arsivIst, sec = (S.arsivSecili || []).filter(a => g[a]).sort(), ister = ad => !f || ad === f;
    const ist = new Map(), faz = new Map(), dis = new Map(), mat = {};
    sec.forEach(a => {
      const rec = g[a], pl = S.arsivVeri && S.arsivVeri[a];
      Object.entries(rec.ist).forEach(([ad, o]) => { if (!ister(ad)) return; const e = ist.get(ad) || {ad, plan: 0, planVar: 0, gercek: 0, kisi: 0, ay: 0}; e.gercek += o.nobet; e.kisi += o.kisi; e.ay++; if (pl && pl.ist[ad]) { e.plan += pl.ist[ad].planlanan; e.planVar++; } ist.set(ad, e); });
      rec.kisi.forEach(k => { if (k.fazla <= 0.01 || !ister(k.kadro)) return; const key = k.ad + '|' + k.kadro, e = faz.get(key) || {ad: k.ad, brans: k.brans, ist: k.kadro, aylar: [], toplam: 0}; e.aylar.push(a); e.toplam += k.fazla; faz.set(key, e); });
      rec.dis.forEach(x => { if (!ister(x.istasyon)) return; const key = x.ad + '|' + x.istasyon, e = dis.get(key) || {ad: x.ad, brans: x.brans, kadro: x.kadro, ist: x.istasyon, aylar: [], nobet: 0}; e.aylar.push(a); e.nobet += x.nobet; dis.set(key, e); (mat[x.istasyon] = mat[x.istasyon] || {})[x.brans] = (mat[x.istasyon][x.brans] || 0) + 1; });
    });
    const kisa = a => a.slice(2).replace('-', '/'), r2 = v => Math.round(v * 100) / 100;
    return {sec,
      ist: [...ist.values()].sort((a, b) => trCollator.compare(a.ad, b.ad)).map(e => [esc(e.ad), e.ay, e.planVar ? r2(e.plan) : '—', r2(e.gercek), e.planVar ? r2(e.gercek - e.plan) : '—', e.kisi]),
      faz: [...faz.values()].sort((a, b) => b.toplam - a.toplam || trCollator.compare(a.ad, b.ad)).map(e => [esc(e.ad), esc(e.brans), esc(e.ist), e.aylar.length, r2(e.toplam), e.aylar.map(kisa).join(', ')]),
      dis: [...dis.values()].sort((a, b) => trCollator.compare(a.ist, b.ist) || trCollator.compare(a.ad, b.ad)).map(e => [esc(e.ad), esc(e.brans), esc(e.kadro), esc(e.ist), r2(e.nobet), e.aylar.map(kisa).join(', ')]),
      mat: Object.keys(mat).sort(trCollator.compare).map(ad => [esc(ad), ...BRANSLAR.map(b => mat[ad][b] || 0), BRANSLAR.reduce((x, b) => x + (mat[ad][b] || 0), 0)])};
  }
  function gercekKartlar() {

      <div class="ap-card"><h2>Gerçekleşen fazla nöbet</h2><p class="ap-note">Kişinin o ay tuttuğu nöbet, standart aylık hedefinin (izin ve muafiyet düşülmeden) üstündeyse fazla sayılır. Kadro istasyonu başlığı altında toplanır.</p>${tabloHtml(['Ad soyad', 'Branş', 'Kadro istasyonu', 'Ay sayısı', 'Toplam fazla nöbet', 'Aylar'], G.faz)}</div>

  }
  function arstatHtml() {
    if (S.arsivVeri === null) { if (!S.arsivYuk) { S.arsivYuk = true; arsivYukle().then(() => { S.arsivYuk = false; render(); }); } return '<div class="ap-card">Arşiv yükleniyor…</div>'; }
    const aylar = [...new Set([...Object.keys(S.arsivVeri), ...Object.keys(S.gercekVeri || {})])].sort();
    if (!aylar.length) return '<div class="ap-card ap-empty"><h2>Arşivde ay yok</h2><p>Önce "Arşiv" sayfasından aylık planı arşive kaydedin ya da Nöbet Listesi Raporu yükleyin.</p></div>';
    const st = arsivIstatistik();
    return `<div class="ap-card"><h2>İstatistik — dönem ve istasyon seçimi</h2>
      <div class="ap-row">${aylar.map(a => `<label class="ap-note"><input type="checkbox" data-act="arsiv-ay" data-v="${a}" ${(S.arsivSecili || []).includes(a) ? 'checked' : ''}> ${ayAd(a)}</label>`).join(' ')}
      <button class="ap-btn sm" data-act="arsiv-ay-hepsi">Tümü</button><button class="ap-btn sm" data-act="arsiv-ay-hic">Hiçbiri</button></div>
      <div class="ap-row" style="margin-top:8px"><label class="ap-note">İstasyon <select class="ap-sel" data-act="arsiv-ist"><option value="">Tüm istasyonlar</option>${st.adlar.map(a => `<option ${a === S.arsivIst ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></label>
      <button class="ap-btn" data-act="arsiv-excel">Excel'e aktar</button><span class="ap-note">${(S.arsivSecili || []).filter(a => aylar.includes(a)).length} ay seçili</span></div></div>

      <div class="ap-card"><h2>Aylara göre seyir (toplam)</h2>${tabloHtml(['Ay', 'İhtiyaç', 'Planlanan', 'Kapasite', 'Çıkan kişi', 'Gelen kişi', 'Fazla nöbet', 'Personel önerilen ist.'], st.seyir)}</div>

      <div class="ap-card"><h2>Çıkan personel — kaç ay çıktı</h2>${tabloHtml(['Ad soyad', 'Branş', 'Çıktığı istasyon', 'Gittiği yer', 'Ay sayısı', 'Aylar'], st.cikSat)}</div>

      <div class="ap-card"><h2>Fazla nöbet alan kişiler</h2>${tabloHtml(['Ad soyad', 'Branş', 'İstasyon', 'Ay sayısı', 'Toplam fazla nöbet', 'Aylar'], st.fazSat)}</div>`;
  }
  function arsivExcel() {
    const st = arsivIstatistik(), wb = XLSX.utils.book_new(), temiz = r => r.map(c => typeof c === 'string' ? c.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;/g, "'").replace(/&quot;/g, '"') : c);
    const ekle = (ad, bas, sat) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([bas, ...sat.map(temiz)]), ad);
    ekle('Seyir', ['Ay', 'İhtiyaç', 'Planlanan', 'Kapasite', 'Çıkan', 'Gelen', 'Fazla nöbet', 'Personel önerilen ist.'], st.seyir);

    ekle('Çıkan personel', ['Ad soyad', 'Branş', 'Çıktığı istasyon', 'Gittiği yer', 'Ay sayısı', 'Aylar'], st.cikSat);

    const G = gercekIstatistik(); if (G.sec.length) { ekle('Gerçekleşen nöbet', ['İstasyon', 'Ay', 'Planlanan', 'Gerçekleşen nöbet', 'Fark', 'Nöbet tutan kişi-ay'], G.ist); ekle('Gerçekleşen fazla', ['Ad soyad', 'Branş', 'Kadro istasyonu', 'Ay sayısı', 'Toplam fazla nöbet', 'Aylar'], G.faz); ekle('Dışarıdan nöbet', ['Ad soyad', 'Branş', 'Kadro istasyonu', 'Nöbet tuttuğu istasyon', 'Nöbet', 'Aylar'], G.dis); }
    xlsxIndir(wb, `ASHI-Arsiv-Istatistik-${(S.arsivSecili || []).slice().sort()[0] || ''}_${(S.arsivSecili || []).slice().sort().pop() || ''}.xlsx`);
  }

  // ================= MODÜL 2 — İSTASYON NÖBET LİSTESİ =================
  const NC = NobetCore;
  const N2_SEKME = [['plan', 'Planlama'], ['istek', 'İstek takvimi'], ['liste', 'Nöbet listesi'], ['denetim', 'Denetim ve öneriler'], ['paket', 'Çıktı']];
  const IHLAL_AD = {eksik: 'Boş nöbet branşı', yetenek: 'Nöbet branşına uygun değil', izin: 'İzinli günde nöbet', cakisma: 'Aynı gün çift görev', dinlenme: 'Dinlenme ihlali', izinOnce: 'Yıllık izin öncesi boşluk', surGunAsiri: 'Sürücü gün aşırı 3 nöbet', isciGece: 'İşçi art arda 3 gece', aralik: 'İki nöbet arası çok uzun', istek: 'İstenmeyen güne nöbet', adet: 'Nöbet sayısı farkı'};
  const GUN_AD = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
  // İstasyon sorumlusu, planlama onaylanmadan (Kesinleştir / Ayı kilitle) kendi istasyonunun planlamasını ve nöbet listesi araçlarını göremez
  const n2Onayli = () => !!S.plan && (S.plan.durum === 'kesin' || S.plan.durum === 'kilitli');
  const n2Acik = () => S.rol !== 'istasyon' || n2Onayli();
  const n2Ist = () => S.n2.ist && S.plan && S.plan.birimler.some(b => b.ad === S.n2.ist) ? S.n2.ist : (S.n2.ist = (S.plan && (S.plan.birimler.find(b => b.tur === 'istasyon' && !b.ekipOf) || {}).ad) || '');
  const n2Birim = () => S.plan && S.plan.birimler.find(b => b.ad === n2Ist());
  function n2Depo(ad) { const N = (S.plan.nobet = S.plan.nobet || {}); return N[ad] = N[ad] || {istek: {}, izin: {}, liste: null, kural: {}, kisiler: null}; }
  const n2Duz = () => S.rol !== 'salt_okur' && !(S.plan && S.plan.durum === 'kilitli');
  function mut2(fn, islem, detay) {
    if (!n2Duz()) { toast(S.plan && S.plan.durum === 'kilitli' ? 'Bu ay kilitli.' : 'Salt okur modundasınız.'); return false; }
    fn(); S.n2.oneri = null; if (islem) logla(islem, detay); kaydet(); return true;
  }
  // Kişi listesi: Modül 1 planından (planlama tarafı) ya da paketle gelen kayıtlardan (istasyon tarafı)
  function n2Kisiler(b) {
    const dp = n2Depo(b.ad);
    if (dp.kisiler && !S.plan.kayitlar.some(k => k.birim === b.ad)) return dp.kisiler;
    return hesapla(b).satir.filter(s => !s.nobetYok).map(s => {
      const k = s.k, azami = Math.floor(s.azami + 1e-9);

  // ---- nöbet listesi ----
  const n2Ad = (G, id) => { const k = G.girdi.kisiler.find(x => x.id === id); return k ? k.ad : ''; };
  function n2ListeHtml(b) {
    const {G, H, L, d} = n2Deneti(b), dp = n2Depo(b.ad), N = H.N, duz = n2Duz(), ks = G.girdi.kisiler, K = G.kural, kap = NC.kapasiteAnalizi(G.girdi, G.kural);
    const hata = new Map(); d.ihlal.forEach(i => { const a = `${i.gun}|${i.kisi == null ? '' : i.kisi}`; hata.set(a, (hata.get(a) || '') + i.mesaj + '\n'); if (i.yuva) hata.set(`${i.gun}||${i.yuva}`, i.mesaj); });

    const hucre = (gun, tip) => { const yuva = tip === 'surG' || tip === 'surA' ? 'sur' : tip, id = L[gun][tip], e = (id != null && hata.get(`${gun}|${id}`)) || (id == null && hata.get(`${gun}||${yuva}`) && (tip === 'sur' || tip === 'es' || tip === 'ysp') ? 'Boş' : '');
      return `<td class="${e ? 'n2e' : ''}" title="${esc(e)}"><select class="ap-sel n2s" data-n2="hucre" data-g="${gun}" data-t="${tip}" ${duz ? '' : 'disabled'}>${secenek(yuva, tip, id)}</select></td>`; };
    const sat = [...Array(N)].map((_, i) => { const g = i + 1, w = new Date(Date.UTC(S.y, S.m - 1, g)).getUTCDay(); return `<tr class="${w === 0 || w === 6 ? 'hs' : ''}"><td class="num">${g}</td><td>${GUN_AD[w]}</td>${hucre(g, 'es')}${hucre(g, 'ysp')}${hucre(g, 'sur')}${ks.some(k => k.grup === 'isci') ? hucre(g, 'surG') + hucre(g, 'surA') : ''}</tr>`; }).join('');
    const sayim = ks.map(k => { let a = 0, y = 0; for (let g = 1; g <= N; g++) ['es', 'ysp', 'sur'].forEach(t => { if (L[g][t] === k.id) a++; }); for (let g = 1; g <= N; g++) ['surG', 'surA'].forEach(t => { if (L[g][t] === k.id) y++; }); return {k, birim: a + y / 2, hedef: (k.adet || 0) + (k.yarim || 0) / 2}; });
    const ozetIh = Object.entries(d.say).filter(([t]) => t !== 'adet').map(([t, n]) => `${IHLAL_AD[t]}: <b>${n}</b>`).join(' · ');
    const kisiGoruntu = S.n2.gorunum === 'kisi';
    const kisiTablo = () => {
      const bas = [...Array(N)].map((_, i) => `<th class="n2d">${i + 1}</th>`).join('');
      return `<div class="ap-tw"><table class="ap-t n2"><thead><tr><th style="text-align:left">Personel</th>${bas}<th>Liste</th><th>Hedef</th></tr></thead><tbody>${sayim.map(({k, birim, hedef}) => {
        const p = H.byId.get(k.id), c = [...Array(N)].map((_, i) => { const g = i + 1; let x = ''; ['es', 'ysp', 'sur', 'surG', 'surA'].forEach(t => { if (L[g][t] === k.id) x = NC.KOD[t]; }); return `<td class="n2c ${x ? 'nb' : p.izin.has(g) ? 'iz' : p.istek.has(g) ? 'is' : ''}">${x || (p.izin.has(g) ? 'İ' : p.istek.has(g) ? '✕' : '')}</td>`; }).join('');
        return `<tr><td class="n2n">${esc(k.ad)}</td>${c}<td class="num"><b>${fmt(birim)}</b></td><td class="num ${Math.abs(birim - hedef) > 0.01 ? 'n2e' : ''}">${fmt(hedef)}</td></tr>`; }).join('')}</tbody></table></div><p class="ap-note">E: ekip şefi · Y: YSP · S: sürücü (24 sa.) · G: sürücü gündüz · A: sürücü gece (12 sa. işçi)</p>`; };
    return `<div class="ap-card"><h2>Otomatik nöbet listesi</h2>
      <div class="ap-row"><label class="ap-note">İki nöbet arası en az <input class="ap-in n" type="number" min="0" max="5" data-n2="kural" data-k="minAra" value="${K.minAra}"> gün boş</label>
      <label class="ap-note">en fazla <input class="ap-in n" type="number" min="1" max="15" data-n2="kural" data-k="maxAra" value="${K.maxAra}"> gün</label>
      <label class="ap-note">yıllık izin öncesi <input class="ap-in n" type="number" min="0" max="10" data-n2="kural" data-k="izinOnce" value="${K.izinOnce}"> gün boşluk</label>
      <label class="ap-note"><input type="checkbox" data-n2="kural" data-k="surGunAsiri" ${K.surGunAsiri ? 'checked' : ''}> sürücüye gün aşırı 3 nöbet (24 sa.) yazma</label>
      <label class="ap-note"><input type="checkbox" data-n2="kural" data-k="isciGece" ${K.isciGece ? 'checked' : ''}> işçiye art arda 3 gece yazma</label></div>
      <div class="ap-row" style="margin-top:10px"><button class="ap-btn pri" data-act="n2-uret" ${duz && !S.n2.calisiyor ? '' : 'disabled'}>${S.n2.calisiyor ? 'Oluşturuluyor…' : '⚙ Otomatik nöbet listesi oluştur'}</button>
      <button class="ap-btn" data-act="n2-liste-temizle" ${duz && dp.liste ? '' : 'disabled'}>Listeyi temizle</button>
      <button class="ap-btn" data-act="n2-excel" ${dp.liste ? '' : 'disabled'}>Excel çıktısı</button>
      <span class="ap-sp"></span><button class="ap-btn ${kisiGoruntu ? '' : 'pri'}" data-act="n2-gorunum" data-v="yuva">Gün görünümü</button><button class="ap-btn ${kisiGoruntu ? 'pri' : ''}" data-act="n2-gorunum" data-v="kisi">Kişi görünümü</button></div>
      ${kap.toplam > 0 ? `<div class="ap-note" style="margin-top:8px;color:var(--ap-bad)"><b>Bu kadroyla ${kap.toplam} nöbet boş kalacak:</b> ${Object.entries(kap.bos).map(([k, n]) => `${NC.YUVA_AD[k]} nöbet branşında ${n}`).join(', ')}. O nöbet branşını tutabilecek yeterli personel yok (ekip şefi: doktor/AABT; sürücü: işçi ya da sürücü teyitli AABT/ATT). Personel isteyin ya da Modül 1'de kişilerin nöbet branşlarını gözden geçirin.</div>` : ''}
      <div style="margin-top:8px">${dp.liste ? `Ceza puanı <b>${d.toplam}</b> · ${ozetIh || '<span style="color:var(--ap-ok)"><b>Hiç kural ihlali yok</b></span>'} ${d.say.adet ? `· Nöbet sayısı farkı olan kişi: <b>${d.say.adet}</b>` : ''}` : '<span class="ap-note">Henüz liste yok. Önce istek takvimini doldurun, sonra butona basın.</span>'}</div></div>
      <div class="ap-card">${kisiGoruntu ? kisiTablo() : `<div class="ap-tw"><table class="ap-t n2l"><thead><tr><th>Gün</th><th></th><th>Ekip şefi</th><th>YSP</th><th>Sürücü (24 sa.)</th>${ks.some(k => k.grup === 'isci') ? '<th>Sürücü gündüz (12)</th><th>Sürücü gece (12)</th>' : ''}</tr></thead><tbody>${sat}</tbody></table></div>`}</div>
      <div class="ap-card"><h2>Kişi başına nöbet</h2>${tabloHtml(['Personel', 'Branş', 'Hedef (Modül 1)', 'Listede'], sayim.map(({k, birim, hedef}) => [esc(k.ad), k.brans || '', hedef, `<span class="${Math.abs(birim - hedef) > 0.01 ? 'n2e' : ''}">${fmt(birim)}</span>`]))}</div>`;
  }

    if (!dp.liste) return '<div class="ap-card ap-empty">Önce nöbet listesi oluşturun ya da elle doldurun.</div>';
    if (!S.n2.oneri) S.n2.oneri = NC.oneriler(L, G.girdi, G.kural, 40);
